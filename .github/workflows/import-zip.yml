
name: Import Birthday ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          if [ ! -f rahma-birthday-fixed.zip ]; then
            echo "ZIP belum diupload. Tidak ada yang dikerjakan."
            exit 0
          fi

          mkdir -p /tmp/rahma
          unzip -q rahma-birthday-fixed.zip -d /tmp/rahma

          PROJECT=$(find /tmp/rahma -name package.json -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "package.json tidak ditemukan!"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'rahma-birthday-fixed.zip' \
            -exec rm -rf {} +

          cp -a "$DIR"/. .
          rm -f rahma-birthday-fixed.zip

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import complete birthday project"
            git push
          fi
